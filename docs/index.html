<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PBG-Bot — Log Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
      background: #fafafa;
    }
    h1 { margin: 0 0 0.5rem 0; }
    .meta { color: #555; font-size: 0.95rem; margin-bottom: 1.25rem; }
    .meta a { color: #0066cc; }
    .summary {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1rem 0 1.5rem 0;
    }
    .stat {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      min-width: 120px;
    }
    .stat .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat .value { font-size: 1.4rem; font-weight: 600; margin-top: 0.2rem; }
    .controls { margin: 1rem 0; display: flex; align-items: center; gap: 1rem; }
    button {
      padding: 0.45rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button:hover { background: #f0f0f0; }
    #status { font-size: 0.85rem; color: #666; }
    #status.err { color: #b00; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      overflow: hidden;
    }
    th, td { text-align: left; padding: 0.55rem 0.8rem; border-bottom: 1px solid #eee; }
    th { background: #f5f5f5; font-weight: 600; position: sticky; top: 0; }
    tr:last-child td { border-bottom: none; }
    tr.changed { background: #fff4d6; }
    tr.changed td { font-weight: 600; }
    tr.error { background: #ffe0e0; }
    tr.initial { background: #e0f0ff; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; }
    .empty { padding: 2rem; text-align: center; color: #888; }
  </style>
</head>
<body>
  <h1>PBG-Bot — Log Viewer</h1>
  <div class="meta">
    Beobachtete Seite:
    <a href="https://mietwohnen-eg.de/mietangebote" target="_blank" rel="noopener">mietwohnen-eg.de/mietangebote</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/Stefan-Maximilian-Dietrich/PBG-Bot/actions" target="_blank" rel="noopener">GitHub Actions Runs</a>
  </div>

  <div class="summary" id="summary"></div>

  <div class="controls">
    <button onclick="loadLogs()">Neu laden</button>
    <span id="status"></span>
  </div>

  <table id="logTable">
    <thead>
      <tr>
        <th>Zeit (UTC)</th>
        <th>Status</th>
        <th>HTTP</th>
        <th>Hash</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="5" class="empty">Lade…</td></tr>
    </tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
