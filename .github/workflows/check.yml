name: Check Munich apartments

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-mietwohnen-eg
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Etwas History (statt shallow depth=1), damit "git pull --rebase"
          # beim Push-Retry einen gemeinsamen Vorfahren findet.
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - run: pip install -r bot/requirements.txt

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # LLM-Anbieter (Default: Google Gemini Flash). Anbieter wechselbar über die
          # optionalen Repo-Variables LLM_BASE_URL / LLM_MODEL.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Hybrid: stärkeres Modell als Fallback, wenn LLM_MODEL nichts extrahiert (Default: gemini-2.5-flash).
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
        run: python -m bot.check

      - name: Commit log + state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state logs snapshots
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: check $(date -u +%FT%TZ)"
          # Push mit Retry: lief parallel ein anderer Check, ist der Push abgelehnt
          # ("fetch first"). Dann rebasen (union-Merge fürs Log) und erneut versuchen.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed (attempt $i)"
              exit 0
            fi
            echo "push rejected — rebase & retry ($i)"
            git pull --rebase origin main || git rebase --abort
            sleep $((RANDOM % 4 + 1))
          done
          echo "push failed after retries"
          exit 1
