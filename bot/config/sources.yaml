# Quellen + Suchkriterien für das Münchner Wohnungs-Suchsystem.
# Drei Standbeine über `pillar`: genossenschaft | freier_markt | staedtisch
# Der freie Markt (ImmoScout/Immowelt/Kleinanzeigen/WG-Gesucht) läuft NICHT hier,
# sondern über die flathunter-Komponente (siehe Plan, Stufe 3).

criteria:
  min_rooms: 2
  max_warm_rent: 1500   # Warmmiete in EUR (inkl. Nebenkosten)
  city: München

defaults:
  user_agent: "Mozilla/5.0 (compatible; PBG-Bot/2.0; +https://github.com/Stefan-Maximilian-Dietrich/PBG-Bot)"
  timeout_seconds: 30

sources:
  # --- Standbein 1: Genossenschaften (öffentlich gelistete Angebotsseiten) ---
  - id: mietwohnen-eg
    name: "Mietwohnen eG"
    pillar: genossenschaft
    url: https://mietwohnen-eg.de/mietangebote
    selector: "div.entry-content"
    active: true

  - id: wagnis-eg
    name: "wagnis eG"
    pillar: genossenschaft
    url: https://www.wagnis.org/aktuelles/freie-wohnungen.html
    active: true   # offene Genossenschaft, nimmt neue Mitglieder auf

  - id: progeno
    name: "Progeno"
    pillar: genossenschaft
    url: https://progeno.de/freie-wohnungen/
    active: true

  # Weitere Genossenschaften: exakte "freie Wohnungen"-URL noch verifizieren,
  # dann active: true setzen (Homepage-URLs erzeugen sonst Rausch-Treffer).
  - id: wg-muenchen-west
    name: "Wohnungsgenossenschaft München-West eG"
    pillar: genossenschaft
    url: https://wg-mw.de/
    active: false   # TODO: Angebotsseite verlinken
  - id: vfv
    name: "Verein für Volkswohnungen eG"
    pillar: genossenschaft
    url: https://www.vfv-muenchen.de/
    active: false   # TODO: Angebotsseite verlinken
  - id: hartmannshofen
    name: "Baugenossenschaft Hartmannshofen eG"
    pillar: genossenschaft
    url: https://bg-hartmannshofen.de/
    active: false   # TODO: Angebotsseite verlinken
  - id: ebm
    name: "Eisenbahner-Baugenossenschaft München-Hbf eG"
    pillar: genossenschaft
    url: https://ebm-muenchen.de/
    active: false   # TODO: Angebotsseite verlinken
  - id: awohnbau
    name: "AWOhnbau Genossenschaft"
    pillar: genossenschaft
    url: https://awohnbau-genossenschaft.de/
    active: false   # TODO: Angebotsseite verlinken
  - id: buergerbauverein
    name: "Bürgerbauverein München eG"
    pillar: genossenschaft
    url: https://www.buergerbauverein-muenchen.de/
    active: false   # TODO: Angebotsseite verlinken

  # Mitglieder-intern (Listen nur im Intranet/per Mail) -> NICHT von außen sichtbar.
  # Aktion = Mitglied werden + Newsletter; später via email_source.py (Stufe 2).
  # - id: wogeno          (https://www.wogeno.de/)        members-only
  # - id: baugen1871      (https://www.baugen1871.de/)    members-only

  # --- Standbein 3: Städtisch/gefördert ---
  # Münchner Wohnen listet selbst nichts (verweist auf SOWON + Portale) -> nicht monitorbar.
  # SOWON ist login-geschützt + Punktevergabe -> sowon_source.py (Stufe 3), nicht hier.
  # - id: muenchner-wohnen (https://www.muenchner-wohnen.de/mieten/wohnungsangebote) active: false
