# Quellen + Suchkriterien für das Münchner Wohnungs-Suchsystem.
# Drei Standbeine über `pillar`: genossenschaft | freier_markt | staedtisch
# Der freie Markt (ImmoScout/Immowelt/Kleinanzeigen/WG-Gesucht) läuft NICHT hier,
# sondern über die flathunter-Komponente (siehe Plan, Stufe 3).

# High Recall: einziges hartes Kriterium ist München (Negativ-Filter in match.py über das
# vom LLM gesetzte Feld in_muenchen). Zimmerzahl und Miete filtern wir bewusst NICHT mehr —
# lieber eine Meldung zu viel als ein verpasstes Angebot (diese Wohnungen sind selten & wertvoll).
criteria:
  city: München

defaults:
  user_agent: "Mozilla/5.0 (compatible; PBG-Bot/2.0; +https://github.com/Stefan-Maximilian-Dietrich/PBG-Bot)"
  timeout_seconds: 30

sources:
  # ===================================================================
  # Standbein 1: Genossenschaften — öffentliche Angebotsseiten (monitorbar)
  # Recherchiert aus VMW-Mitgliederverzeichnis + Einzelprüfung (Stand 2026-06).
  # ===================================================================

  - id: mietwohnen-eg
    name: "Postbaugenossenschaft München u. Oberbayern (mietwohnen-eg)"
    pillar: genossenschaft
    # Die .de-Seite zeigt nur einen Platzhalter; die Angebote laufen über ein eingebettetes
    # ImmoScout24-Portal-Widget (server-seitig gerendert, statisch abrufbar).
    url: https://portal.immobilienscout24.de/suche/54992277
    active: true   # listet auch Objekte außerhalb Münchens (Rosenheim, Erding ...) -> in_muenchen-Filter greift

  - id: wagnis-eg
    name: "wagnis eG"
    pillar: genossenschaft
    url: https://www.wagnis.org/aktuelles/freie-wohnungen.html
    selector: "section.ce_accordion"   # je Angebot ein Accordion; meidet langen Marketing-/Menütext
    active: true   # offene Genossenschaft, nimmt neue Mitglieder auf

  - id: progeno
    name: "Progeno eG"
    pillar: genossenschaft
    url: https://progeno.de/freie-wohnungen/
    active: true   # offen, Aufnahme über Infoabend

  - id: bauverein-haidhausen
    name: "Bauverein München Haidhausen eG"
    pillar: genossenschaft
    url: https://bauverein-haidhausen.de/wohnungsangebote
    selector: ".mieteinheit-selector"   # Angebots-Kacheln; Detail-Links werden von hier gefolgt
    detail_pages: true   # Übersicht zeigt nur Titel; Miete/qm stehen auf den Detailseiten
    active: true   # listet 2-3-Zi. öffentlich, Bewerbung online

  - id: postbg
    name: "PostBG München eG (Bundespostbeamte)"
    pillar: genossenschaft
    url: https://postbg-muenchen.de/vermietungsangebote
    active: true

  - id: vfv
    name: "Verein für Volkswohnungen eG"
    pillar: genossenschaft
    url: https://www.vfv-muenchen.de/wohnungsangebote
    active: true   # nimmt Mitglieder auf

  - id: bwv
    name: "Beamtenwohnungsverein München eG"
    pillar: genossenschaft
    url: https://bwv-muenchen.de/aktuelles/wohnungsangebote
    active: true   # nimmt Mitglieder auf

  - id: vfw
    name: "Verein für Wohnungskultur eG"
    pillar: genossenschaft
    url: https://vfw-muenchen.de/mietangebote/
    active: true

  - id: bg-1898
    name: "Baugenossenschaft des Verkehrspersonals 1898 eG"
    pillar: genossenschaft
    url: https://www.bg-1898.de/mietangebote
    active: true

  - id: wbg1951
    name: "WBG der Flieger- und Kriegsgeschädigten in Bayern eG"
    pillar: genossenschaft
    url: https://wbg1951.de/wohnungsangebote
    active: true

  - id: stadtimpuls
    name: "Stadtimpuls eG"
    pillar: genossenschaft
    url: https://www.stadtimpuls-genossenschaft.de/wohnungen
    selector: "div.wixui-repeater__item"   # je Wohnung ein Repeater-Item; meidet langen Wix-Marketingtext
    active: true   # neue Genossenschaft, nimmt Mitglieder auf

  # Wohngenossenschaft Linde (Kracherhof) ENTFERNT: Projekt liegt in Eresing,
  # Landkreis Landsberg — nicht Stadt München (Agenten-Check 2026-06).

  - id: hartmannshofen
    name: "Baugenossenschaft Hartmannshofen eG"
    pillar: genossenschaft
    url: https://bg-hartmannshofen.de/wohnungsangebote
    active: true   # nimmt Nicht-Mitglieder (erst bewerben, dann Mitglied)

  - id: brf
    name: "Baugenossenschaft Reichsbahnwerk Freimann eG"
    pillar: genossenschaft
    url: https://brf-muenchen.de/mietangebote/
    active: true   # ⚠️ Mitgliedschaft auf bestimmte (bahnnahe) Personen beschränkt

  - id: ebm
    name: "Eisenbahner-Baugenossenschaft München-Hbf eG (ebm)"
    pillar: genossenschaft
    url: https://ebm-muenchen.de/mietangebote
    active: true   # ⚠️ Warteliste geschlossen, aber gelistete Angebote bewerbbar

  - id: iwg
    name: "IWG Isar Wohnungsbaugenossenschaft eG"
    pillar: genossenschaft
    url: https://www.iwg-muenchen.de/wohnungsangebote/
    selector: ".uagb-inner-tab-0"   # nur der Wohnungen-Tab; meidet den irreführenden Dauer-Platzhalter "keine Wohnungen verfügbar"
    active: true   # ⚠️ nimmt derzeit keine neuen Mitglieder auf

  - id: koogro
    name: "Kooperative Großstadt eG (FREIMUNDO Neufreimann)"
    pillar: genossenschaft
    url: https://kooperative-grossstadt.de/freimundo/
    active: true
    # Projekt-Seite -> meldet, sobald FREIMUNDO-Wohnungen erscheinen (aktuell keine).
    # Authoritativer Kanal ist der KooGro-Newsletter -> zusätzlich manuell abonnieren.

  # --- Runde 2 (Agenten-Recherche 2026-06): weitere statisch überwachbare Genossenschaften ---

  - id: wohnturban
    name: "wohntURBAN eG (Projekt Ponyhof, Kreativquartier)"
    pillar: genossenschaft
    url: https://www.wohnturban.de/wohnen-projekte/ponyhof/wohnungen/
    selector: "div.apt-container"
    active: true

  - id: ebg-west
    name: "EBG München-West eG (Laim/Neuhausen)"
    pillar: genossenschaft
    url: https://ebg-muenchen-west.de/wohnungsangebote/
    active: true

  - id: bmseg
    name: "Baugenossenschaft München-Süd eG (Sendling)"
    pillar: genossenschaft
    url: https://bmseg.de/wohnungsbewerber
    selector: "div.et_pb_text_inner"
    active: true   # aktuell Aufnahmestopp; Statuswechsel wird erkannt

  - id: hbg-pasing
    name: "Heimstättenbaugenossenschaft Pasing eG"
    pillar: genossenschaft
    url: https://hbgpasing.de/aktuelles/wohnungsbewerbung.html
    active: true   # ~300 Whg in Pasing; Seite mit Encoding-Eigenheit (Umlaute), Status trotzdem erkennbar

  - id: raumfair
    name: "raumFAIR eG (Freiham/Lochhausen)"
    pillar: genossenschaft
    url: https://raumfair.de/wohnungen
    selector: "div.mod_listing-table"
    active: true

  - id: bauverein-giesing
    name: "Bauverein Giesing eG"
    pillar: genossenschaft
    url: https://www.bvgiesing.de/
    selector: "div.et_pb_text_inner"
    active: true   # restriktive Vergabe, aber Statuswechsel statisch erkennbar

  # --- Runde 3 (5-Agenten-Konsens-Suche 2026-06): statisch überwachbare Stadt-München-eGs ---

  - id: bgms1909
    name: "Baugenossenschaft München-Schwabing eG (1909)"
    pillar: genossenschaft
    url: https://www.bgms1909.de/
    active: true   # keine eigene Angebotsseite; Status ("keine Neubewerbungen") auf der Startseite, per Diff erkennbar

  - id: kriegersiedlung
    name: "Baugenossenschaft Kriegersiedlung eG (Sendling)"
    pillar: genossenschaft
    url: https://www.kriegersiedlung.de/
    active: true   # keine eigene Angebotsseite; Aufnahmestopp-Status auf der Startseite, per Diff erkennbar

  # Konsens-Suche 2026-06 zusätzlich gefunden, bewusst NICHT aufgenommen:
  #   MARO eG (4/5 Agenten, aber Angebote aktuell im weiteren Umland), WBG Gräfelfing (Lkr München);
  #   tote/fehlende Websites: MZB, MKB, WBG München-Solln, Wohnungsbauverein München;
  #   nur über Portale: Mieter-Selbsthilfe Bayern.

  # Mitbauzentrale München: NICHT als Angebots-Quelle aufgenommen — die Projektbörse
  # listet Projekte (keine Einzelwohnungen mit Zimmer/Miete), und der eigentliche
  # Frühwarn-Kanal ist der MONATS-NEWSLETTER (E-Mail). Auswertbar erst über die geplante
  # E-Mail-Ingestion (Stufe 2, IMAP). Bis dahin: Newsletter manuell abonnieren
  # (mitbauzentrale-muenchen.de/newsletter.html).

  # ===================================================================
  # Inaktiv — geprüft, aber NICHT sinnvoll zu monitoren (Stand 2026-06):
  # ===================================================================
  # Mitglieder-intern / keine öffentliche Liste:
  #   WOGENO (wogeno.de), Baugen. 1871 (baugen1871.de),
  #   WG München-West (wg-mw.de, Listings hinter Aareon-Login)
  # Warteliste geschlossen, keine neuen Mitglieder:
  #   Münchner Baugenossenschaft, BG Oberwiesenfeld (bgmo.de),
  #   BG Nord-West (bgnw-muenchen.de),
  #   WG München-Pasing (wg-pasing.de), wabe.zwo (wabezwo.de)
  #   Frauen Wohnen (frauenwohnen.de — nur Frauen mit EOF-Schein >=50 Punkte)
  # Projekt-Genossenschaften ohne laufende Angebotsliste (Aufnahme als Mitglied
  # für künftige Projekte, kein Monitoring): Stadtbaustein,
  #   AWOhnbau, Bürgerbauverein, Das große kleine Haus
  # Agentur, kein eigener Bestand: GIMA München (gima-muenchen.de)
  # Platzhalter-/keine Website: BG Obermenzing (bg-obermenzing.de)
  #
  # Geprüft 2026-06 & ABGELEHNT (nicht statisch überwachbar / außerhalb Stadt):
  #   EBG München-Ost (keine Angebotsstruktur), EBG Pasing (nur Visitenkarte),
  #   BG Ober-/Unterschleißheim (JS/Immowelt-Widget), Grünwald (außerhalb Stadt),
  #   "Gemeinsam in Garching" (Bezug erst ~2029)
  # (BG München Süd, Heimstätten Pasing, EBG München-West, Bauverein Giesing, wohntURBAN,
  #  raumFAIR sind seit der Agenten-Recherche 2026-06 AKTIV — siehe oben.)

  # ===================================================================
  # Standbein 3: Städtisch/gefördert — SOWON (Login + Punktevergabe) und
  # München Modell sind überwiegend administrativ -> sowon_source.py (Stufe 3).
  # Münchner Wohnen listet selbst nichts (verweist auf SOWON + Portale).
  # ===================================================================
